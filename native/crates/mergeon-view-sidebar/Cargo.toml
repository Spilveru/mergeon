[package]
name = "mergeon-view-sidebar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
gpui-kit.workspace = true
mergeon-ui.workspace = true
mergeon-app.workspace = true
mergeon-model.workspace = true
mergeon-backend.workspace = true
mergeon-gitcmd.workspace = true
mergeon-git-ops.workspace = true
mergeon-git-query.workspace = true
mergeon-store.workspace = true
mergeon-github.workspace = true
mergeon-updater.workspace = true

[dev-dependencies]
# `#[gpui_kit::test]` y `gpui_kit::test` (ventanas sin pantalla para los tests
# de interacción).
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
env_logger = "0.11"
# El `UiHost` de la galería responde por canales y valida los prompts con su patrón.
futures = "0.3"
regex.workspace = true
