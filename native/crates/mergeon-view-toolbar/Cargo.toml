[package]
name = "mergeon-view-toolbar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
gpui-kit.workspace = true
mergeon-ui.workspace = true
mergeon-app.workspace = true
mergeon-model.workspace = true
mergeon-backend.workspace = true
mergeon-gitcmd.workspace = true
mergeon-git-ops.workspace = true
mergeon-git-query.workspace = true
mergeon-store.workspace = true
mergeon-github.workspace = true
mergeon-updater.workspace = true
# Hora local de cada entrada del log de operaciones (`toLocaleTimeString`), con
# la misma configuración que mergeon-model.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
env_logger = "0.11"
# Respuestas del `UiHost` de la galería (`mergeon_app::Answer` es un oneshot).
futures = "0.3"
# El `pattern` de los prompts que pide el modelo, en el `UiHost` de la galería.
regex.workspace = true
