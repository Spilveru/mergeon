[package]
name = "mergeon-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
mergeon-gitcmd.workspace = true
mergeon-git-ops.workspace = true
mergeon-git-query.workspace = true
mergeon-runtime.workspace = true
mergeon-store.workspace = true
mergeon-github.workspace = true
# `mergeon-updater` todavía no es dependencia: se enchufa por `UpdaterBridge`
# (ver `src/updater.rs`).

# `new URL(...)` de `shell:openExternal`: mismo parser WHATWG que el original.
url = "2.5"
# `randomUUID()` de `createOperationId`.
uuid = { version = "1", features = ["v4"] }
# Cifrado autenticado de los tokens con la clave maestra del llavero.
aes-gcm = "0.11"
base64 = "0.22"
# Llavero del sistema (el papel de `safeStorage`). Backends nativos en Windows
# y macOS; en Linux, Secret Service por D-Bus con la implementación en Rust
# puro (`async-secret-service` + `async-io` + `crypto-rust`): no enlaza con
# libdbus ni con OpenSSL, así que no pide librerías C del sistema en CI.
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }

[dev-dependencies]
tempfile.workspace = true
